name: Install JABAKHANJI STORE site files
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site-package.zip
      - .github/workflows/install-site.yml
permissions:
  contents: write
concurrency:
  group: install-jabakhanji-site
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify and extract the complete site
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json, zipfile
          archive = Path('site-package.zip')
          expected = 'c90029cc934d55006f1fe34b841d78888d704f48ec8b63e407f5f68b6a6cf0ef'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected, 'Unexpected package checksum'
          allowed = {'.nojekyll', 'LICENSE-PSFree.txt', 'README.md', 'SHA256SUMS.json', 'index.html', 'credits.html', 'assets', 'host'}
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None, 'Damaged archive'
              for info in z.infolist():
                  p = PurePosixPath(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts and p.parts[0] in allowed
                  assert ((info.external_attr >> 16) & 0o170000) != 0o120000, 'Symlink not allowed'
              z.extractall('.')
          for name, digest in json.loads(Path('SHA256SUMS.json').read_text()).items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          print('All 71 site files extracted and verified.')
          PY
      - name: Commit the unpacked website to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .nojekyll LICENSE-PSFree.txt README.md SHA256SUMS.json index.html credits.html assets host
          if ! git diff --cached --quiet; then
            git commit -m 'Install complete JABAKHANJI STORE PS4 host with local payloads'
            git push origin HEAD:main
          fi
